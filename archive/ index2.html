<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>adress lists</title>
<style>
  body {
    margin: 0;
    background: #b5b5b5;
    overflow: hidden;
  }
  canvas {
    display: block;
    margin: 0 auto;
    background-color: #b5b5b5;
  }
</style>
</head>
<body>
<canvas id="myCanvas"></canvas>

<script>
const imageFiles = [
  '26rn260.jpg',
  '32rn291 copy.jpg',
  '32rn292.jpg',
  '33rn300-01.jpg',
  '39rn330.jpg',
  '40rn334-01.jpg',
  '73rn-02 copy.jpg'
];

const images = [];
let ctx;
const canvasWidth = 3500;
const canvasHeight = 2480;

// Загрузка изображений
const loadedImages = [];
let imagesLoadedCount = 0;

function preloadImages() {
  imageFiles.forEach((filename, index) => {
    const img = new Image();
    img.src = filename;
    img.onload = () => {
      console.log(`Loaded ${filename} with size: ${img.width}x${img.height}`);
      loadedImages[index] = img;
      imagesLoadedCount++;
      if (imagesLoadedCount === imageFiles.length) {
        init(); // Запуск после загрузки всех изображений
        requestAnimationFrame(draw);
      }
    };
  });
}

// Инициализация холста
function init() {
  const canvas = document.getElementById('myCanvas');
  canvas.width = canvasWidth;
  canvas.height = canvasHeight;
  ctx = canvas.getContext('2d');
}

// Функция для случайных чисел
function randRange(min, max) {
  return Math.random() * (max - min) + min;
}

function randInt(min, max) {
  return Math.floor(Math.random() * (max - min + 1)) + min;
}

// Основная функция рисования
function draw() {
  // Очистка экрана
  ctx.fillStyle = "#B5B5B5";
  ctx.fillRect(0, 0, canvasWidth, canvasHeight);

  // Выбор случайного изображения
  const img = loadedImages[Math.floor(Math.random() * loadedImages.length)];
  if (img) {
    // Выбор случайных параметров
    const x = randRange(-500, canvasWidth);
    const y = randRange(-500, canvasHeight);
    const width = randRange(1000, 1000); // Можно сделать произвольно
    const height = randRange(1000, 1000); // Можно сделать произвольно

    const x1 = randInt(1, 5000);
    const y1 = randInt(1, 5000);
    const x2 = randInt(5000, 10000);
    const y2 = randInt(5000, 10000);

    const drawWidth = x2 - x1; // Размер по ширине, или просто можно задать свой эффект
    const drawHeight = y2 - y1;

    // Отрисовка изображения
    ctx.drawImage(img, x, y, width, height);
  } else {
    console.log('no img loaded');
  }

  // Можно сделать цикл для постоянного обновления:
  // requestAnimationFrame(draw);
}

// Запуск
preloadImages();
</script>
</body>
</html>
